services:
  backend:
    build: ./backend
    container_name: uvms-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/uvms
      JWT_SECRET: "uvms_development_secret_change_this_2026"
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    container_name: uvms-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  frontend:
    build: ./frontend
    container_name: uvms-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
